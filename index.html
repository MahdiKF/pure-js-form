<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ["poppins"]
                    }
                }
            }
        }
    </script>
    <title>Document</title>
</head>

<body class="bg-blue-50 font-poppins">
    <form id="registerForm" class="bg-white p-16 my-32 max-w-3xl mx-auto rounded  space-y-7">
        <div>
            <h1 class="text-3xl">Register Form</h1>
        </div>
        <div class=" form-group">
            <label for="fullName" class="">Full Name</label>
            <input required minlength="3"  customMaxlength="6" type="text"
                class="bg-blue-100 block py-2 px-4 w-full rounded focus:outline-none focus:bg-blue-200"
                name="fullName" />

            <div class="error text-red-700 py-2"></div>
        </div>
        <div class=" form-group">
            <label for="email" class="">Email</label>
            <input required type="email"
                class="bg-blue-100 block py-2 px-4 w-full rounded focus:outline-none focus:bg-blue-200" id="email"
                name="email" />
            <div class="error text-red-700 py-2"></div>
        </div>
        <div class="flex space-x-4">
            <div class="w-1/2 form-group">
                <label for="password" class="">password</label>
                <input required type="password"
                    class="bg-blue-100 block py-2 px-4 w-full rounded focus:outline-none focus:bg-blue-200"
                    id="password" name="password" />
                <div class="error text-red-700 py-2"></div>
            </div>
            <div class="w-1/2  form-group">
                <label for="rpassword" class="">Repeat Password</label>
                <input required type="password"
                    class="bg-blue-100 block py-2 px-4 w-full rounded focus:outline-none focus:bg-blue-200"
                    id="rpassword" name="rpassword" />
                <div class="error text-red-700 py-2"></div>
            </div>

        </div>

        <input type="submit" class="bg-blue-300 text-white py-2 w-full rounded font-bold hover:bg-blue-500">
    </form>

    <script src="./script.js"></script>
</body>

</html>
